<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 22 285 132">
  <defs>
    <!-- Darker Blue Gradient for QA -->
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Cyan-Blue Accent for Verification Check Tail -->
    <linearGradient id="checkGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Controlled Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- BIG "QA" (Dark Blue) -->
    <!-- "Q" -->
    <text x="0" y="85"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="96"
          fill="url(#darkBlueGrad)"
          letter-spacing="-1">Q</text>

    <!-- Verification Tail for the Q -->
    <path d="M 52 74 L 64 86 L 86 60"
          fill="none"
          stroke="url(#checkGradDark)"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#softShadow)" />

    <!-- "A" -->
    <text x="96" y="85"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="96"
          fill="url(#darkBlueGrad)"
          letter-spacing="-1">A</text>

    <!-- Divider Line -->
    <line x1="4" y1="104" x2="250" y2="104" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <circle cx="260" cy="104" r="3.5" fill="#1e3a8a" />

    <!-- SMALL "DOCUMENTATION" (Solid Black) -->
    <text x="4" y="126"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace"
          font-weight="800"
          font-size="14.5"
          letter-spacing="9"
          fill="#000000">DOCUMENTATION</text>
  </g>
</svg>
